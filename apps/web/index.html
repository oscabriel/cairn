<!doctype html>
<!-- The root attributes and base style follow t3code's index.html at fe27e8e3 as served (dark, black
     background, the appearance variables its CSS reads), with its brand removed. -->
<html
  lang="en"
  class="dark"
  style="
    background-color: rgb(0, 0, 0);
    --appearance-contrast-base: 100%;
    --appearance-contrast-boost: 0%;
    --appearance-contrast-border-boost: 0%;
    --glass-opacity: 80%;
    font-size: 16px;
    --font-size-prompt: 14px;
    --font-size-code: 13px;
    --diffs-font-size: 13px;
    -webkit-font-smoothing: antialiased;
  "
  data-diff-color-scheme="red-green"
  data-chat-width="comfortable"
>
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="rgb(0, 0, 0)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Cairn" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Cairn</title>
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
      }
      body {
        color: #262626;
        background: #fff;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      }
      html.dark body {
        color: #f5f5f5;
        background: #0a0a0a;
      }
    </style>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body style="background-color: rgb(0, 0, 0)">
    <div id="root"></div>
    <!-- The server replaces this element's text with the shell snapshot as boot JSON (plan D46);
         the dev server leaves it null and the client waits for the socket. -->
    <script id="cairn-boot" type="application/json">
      null
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
